[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blaxk-grabber"
version = "2.0.0"
description = "BlaXk Grabber — YouTube media grabber with Spotify/Audiomack metadata lookup"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "mutagen",
    "rich",
    "requests",
    "beautifulsoup4",
    "Pillow",
    "customtkinter",
]

[project.scripts]
blaxk = "youtube_media_grabber.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["youtube_media_grabber*"]